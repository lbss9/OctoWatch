[package]
name = "octowatch-core"
version = "0.1.0"
edition = "2021"
description = "Shared OctoWatch core: GitHub API client and monitor, exposed via UniFFI."
license = "MIT"

[lib]
name = "octowatch_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
octocrab = "0.44"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http = "1"
thiserror = "2"
once_cell = "1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
